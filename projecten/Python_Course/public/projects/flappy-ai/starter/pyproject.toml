[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "flappy-ai"
version = "0.1.0"
description = "Starter workspace for Flappy Bird AI"
requires-python = ">=3.11"
dependencies = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
